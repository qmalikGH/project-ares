<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: 80% safe area (icon scaled to ~410px centered).
       Android adaptive icons crop to a circle/squircle, so we keep important
       glyph content well inside the inner 410x410 box. -->
  <defs>
    <linearGradient id="a-stroke-m" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF9"/>
      <stop offset="100%" stop-color="#A5E0FB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0A0A0B"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none"
     stroke="url(#a-stroke-m)" stroke-width="34">
    <path d="M 156 380 L 256 154 L 356 380"/>
    <path d="M 196 308 L 316 308"/>
  </g>
</svg>
