name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs `prisma generate`, so the client is available to
      # every step below without a separate invocation.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # Not running `npm run build`: it chains prisma generate +
      # scripts/maybe-migrate.mjs, and while that script skips cleanly without
      # DATABASE_URL/DIRECT_URL, the build adds minutes without catching
      # anything typecheck misses.
